[package]
name = "exp-mpz-ferret"
description = "Experiment: mpz-ot-core's Ferret over dpf_common's Channel, bootstrapped from our KOS COTs, against our ot::ferret."
version = "0.1.0"
edition = "2021"

# Own workspace: mpz needs Rust 1.95 (edition 2024) and rand 0.10, while the
# main workspace is pinned to 1.87 and rand 0.8. The root Cargo.toml excludes
# this directory.
[workspace]

[dependencies]
dpf-common = { path = "../../crates/common" }
mpz-ot-core = { git = "https://github.com/privacy-scaling-explorations/mpz", rev = "2cdf3b75767020042b546e385f45a401f436e172" }
mpz-core = { git = "https://github.com/privacy-scaling-explorations/mpz", rev = "2cdf3b75767020042b546e385f45a401f436e172" }
mpz-common = { git = "https://github.com/privacy-scaling-explorations/mpz", rev = "2cdf3b75767020042b546e385f45a401f436e172", features = ["future"] }
rand = "0.8"
rand_chacha = "0.3"
serde = "1"
bincode = "1.3"

[[example]]
name = "bench-mpz-ferret"
path = "examples/bench.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.test]
opt-level = 3
