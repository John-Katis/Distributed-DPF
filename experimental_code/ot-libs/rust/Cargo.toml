[package]
name = "exp-ot-libs"
description = "Experiment: our OTs against mpz and swanky (CryProt is in ../rust-cryprot, emp-ot and libOTe in ../cpp)."
version = "0.1.0"
edition = "2024"

# Own workspace: swanky pins Rust 1.99 and mpz needs 1.95, while the main
# workspace is pinned to 1.87. The root Cargo.toml excludes experimental_code/ot-libs.
[workspace]

[dependencies]
dpf-common = { path = "../../../crates/common" }
exp-mpz-ferret = { path = "../../mpz-ferret" }
rand = "0.8"
rand_chacha = "0.3"
rand010 = { package = "rand", version = "0.10" }
bincode = "1.3"
serde = "1"

mpz-ot-core = { git = "https://github.com/privacy-scaling-explorations/mpz", rev = "2cdf3b75767020042b546e385f45a401f436e172" }
mpz-core = { git = "https://github.com/privacy-scaling-explorations/mpz", rev = "2cdf3b75767020042b546e385f45a401f436e172" }
mpz-common = { git = "https://github.com/privacy-scaling-explorations/mpz", rev = "2cdf3b75767020042b546e385f45a401f436e172", features = ["future"] }


swanky-ot-alsz-kos = { git = "https://github.com/GaloisInc/swanky", rev = "cdbf4c0" }
swanky-ot-chou-orlandi = { git = "https://github.com/GaloisInc/swanky", rev = "cdbf4c0" }
swanky-ot-noar-pinkas = { git = "https://github.com/GaloisInc/swanky", rev = "cdbf4c0" }
swanky-ot-traits = { git = "https://github.com/GaloisInc/swanky", rev = "cdbf4c0" }
swanky-channel-legacy = { git = "https://github.com/GaloisInc/swanky", rev = "cdbf4c0" }
swanky-block = { git = "https://github.com/GaloisInc/swanky", rev = "cdbf4c0" }
swanky-field-binary = { git = "https://github.com/GaloisInc/swanky", rev = "cdbf4c0" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
