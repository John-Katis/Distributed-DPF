[package]
name = "exp-ot-libs-cryprot"
description = "Experiment: CryProt's OTs, in the row format of ../rust (own crate: CryProt pins aes = 0.9.1, swanky/mpz need ^0.9.3)."
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
cryprot-ot = { git = "https://github.com/robinhundt/CryProt", rev = "1e5cb7a" }
cryprot-net = { git = "https://github.com/robinhundt/CryProt", rev = "1e5cb7a", features = ["__testing"] }
cryprot-core = { git = "https://github.com/robinhundt/CryProt", rev = "1e5cb7a" }
subtle = "2.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = "0.3"
tracing = "0.1"
rand = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
