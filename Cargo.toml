[workspace]
resolver = "2"
members = ["crates/*", "protocols/*", "experimental_code/*"]
# Own workspaces (Rust 1.95, rand 0.10 through mpz; C++ libraries in ot-libs).
exclude = ["experimental_code/mpz-ferret", "experimental_code/ot-libs"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
dpf-common = { path = "crates/common" }
aes = "0.8"
rand = "0.8"
rand_chacha = "0.3"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.test]
opt-level = 3
